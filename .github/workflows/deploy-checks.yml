# Checks the files a release ships for installing Sora.
name: Deploy checks

on:
  pull_request:
    paths:
      - deploy/**
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - deploy/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck deploy/install.sh
        run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 /mnt/deploy/install.sh
      - name: bash -n with the oldest bash it must run on (macOS ships 3.2)
        run: docker run --rm -v "$PWD:/mnt:ro" bash:3.2 bash -n /mnt/deploy/install.sh

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker compose config, both access profiles
        working-directory: deploy
        run: |
          cat >.env <<'EOF'
          SORA_VERSION=0.0.0
          POSTGRES_PASSWORD=check
          AUTH_SECRET=check
          STREAM_SIGNING_SECRET=check
          WEB_CLIENT_KEY=check
          TMDB_READ_ACCESS_TOKEN=check
          ANIME_SCHEDULE_API_KEY=check
          SORA_DOMAIN=sora.example.com
          EOF
          COMPOSE_PROFILES=http docker compose config --quiet
          COMPOSE_PROFILES=https docker compose config --quiet

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color
