# The scheduled episodes of the given entries, aired or not, with when each
# airs, by entry and episode.
query EpisodeAirings($ids: [Int!]!, $page: Int!) {
	Page(page: $page, perPage: 50) {
		pageInfo {
			hasNextPage
		}
		airingSchedules(mediaId_in: $ids, sort: [MEDIA_ID, EPISODE]) {
			mediaId
			episode
			airingAt
		}
	}
}

# The latest aired episode of one entry.
query LatestAiring($id: Int!) {
	Page(page: 1, perPage: 1) {
		airingSchedules(mediaId: $id, notYetAired: false, sort: [EPISODE_DESC]) {
			episode
			airingAt
		}
	}
}
