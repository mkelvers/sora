# One page of the anime catalogue, with what the local search index matches,
# filters, and ranks on: most popular first for a full sweep, or newest change first
# to catch up on what changed since the last one. AniList serves at most
# 5000 entries per filter, so a full sweep narrows `popularityBelow` as it goes.
query SearchIndexPage($page: Int!, $sort: [MediaSort!]!, $popularityBelow: Int) {
	Page(page: $page, perPage: 50) {
		pageInfo {
			hasNextPage
		}
		media(type: ANIME, sort: $sort, popularity_lesser: $popularityBelow) {
			id
			title {
				romaji
				english
				native
			}
			synonyms
			format
			status
			season
			seasonYear
			startDate {
				year
				month
				day
			}
			genres
			tags {
				name
				rank
				isMediaSpoiler
				isAdult
			}
			# Only the main studios: the rest are its production committee.
			studios(isMain: true) {
				nodes {
					name
				}
			}
			source(version: 3)
			countryOfOrigin
			# What it adapts, to tell where its story comes from: the anime of a
			# Korean comic is made in Japan, and that comic adapts a web novel.
			relations {
				edges {
					relationType(version: 2)
					node {
						countryOfOrigin
						source(version: 3)
					}
				}
			}
			episodes
			duration
			popularity
			trending
			averageScore
			stats {
				scoreDistribution {
					amount
				}
			}
			isAdult
			updatedAt
		}
	}
}
