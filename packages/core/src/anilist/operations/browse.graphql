query BrowseAnime(
	$page: Int!
	$perPage: Int!
	$search: String
	$sort: [MediaSort!]!
	$season: MediaSeason
	$seasonYear: Int
	$format: [MediaFormat!]
	$excludedFormats: [MediaFormat!]!
	$status: MediaStatus
	$genres: [String!]
) {
	Page(page: $page, perPage: $perPage) {
		pageInfo {
			currentPage
			hasNextPage
		}
		media(
			type: ANIME
			isAdult: false
			search: $search
			sort: $sort
			season: $season
			seasonYear: $seasonYear
			format_in: $format
			format_not_in: $excludedFormats
			status: $status
			genre_in: $genres
		) {
			...AnimeCard
		}
	}
}

query Genres {
	GenreCollection
}
