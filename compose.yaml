# Local development database: `docker compose up -d`.
name: sora

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sora
      POSTGRES_PASSWORD: sora
      POSTGRES_DB: sora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sora -d sora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database-data:
